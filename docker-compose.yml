services:
  # Frontend - Next.js
  frontend:
    image: bombo/frontend:latest
    container_name: bombo-frontend
    pull_policy: never
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    networks:
      - bombo-network
    restart: unless-stopped

  # Backend - FastAPI
  backend:
    image: bombo/backend:latest
    container_name: bombo-backend
    pull_policy: never
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - BILI_COOKIE=${BILI_COOKIE}
      - BILI_WBI_KEY=${BILI_WBI_KEY}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ARK_API_KEY=${ARK_API_KEY}
      - DOUBAO_MODEL=${DOUBAO_MODEL:-doubao-seed-2-0-lite-260428}
      - ENABLE_AI_ANALYSIS=${ENABLE_AI_ANALYSIS:-true}
    depends_on:
      - postgres
      - redis
    networks:
      - bombo-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: bombo-postgres
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-bombo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bombo123}
      - POSTGRES_DB=${POSTGRES_DB:-bombo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - bombo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bombo -d bombo"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: bombo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bombo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: bombo-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx_ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - bombo-network
    restart: unless-stopped

networks:
  bombo-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: